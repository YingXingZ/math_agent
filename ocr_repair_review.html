<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCR Repair 教师复核</title>
<style>body{font:16px system-ui,"Microsoft YaHei";max-width:1200px;margin:28px auto;background:#f6f8fb;color:#172033;padding:0 16px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:minmax(260px,1fr) 1fr;gap:16px}.crop{max-width:100%;border:1px solid #ddd}.candidate{white-space:pre-wrap;background:#f8fafc;padding:10px;border-radius:8px;margin:8px 0}button{padding:8px 12px;border:0;border-radius:7px;background:#2563eb;color:white;cursor:pointer;margin-right:8px}.reject{background:#b91c1c}.muted{color:#64748b;font-size:13px}.risk{color:#b45309} @media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
<h1>OCR Repair · 教师确认</h1><p>候选仅供对照。确认或拒绝都不会写回题库；正式采纳必须走独立、显式的入库流程。</p><button onclick="load()">刷新待复核项</button><div id="list">加载中…</div>
<script>
const base=location.pathname.startsWith('/ocr-repair')?'/api':''; const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(path,opt){let r=await fetch(base+path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
async function load(){let host=document.querySelector('#list');host.textContent='加载中…';try{let data=await api('/ocr-repair/reviews?status=pending');host.innerHTML=data.items.length?data.items.map(render).join(''):'<div class="card">没有待复核候选。</div>'}catch(e){host.textContent='读取失败：'+e.message}}
function render(x){let cs=x.candidates.map(c=>`<div class="candidate"><b>${esc(c.provider)}</b> · 置信度 ${Number(c.confidence||0).toFixed(2)}<br>${esc(c.latex_text||'未给出候选')}<div class="risk">${esc(c.risks_json||'')}</div></div>`).join('');let crop=x.anchor_id?`<img class="crop" src="${base}/ocr-repair/crops/${x.anchor_id}" alt="候选原图">`:'无候选裁图';return `<section class="card"><b>${esc(x.section_no)} 第 ${esc(x.problem_no)} 题</b> · 推荐：${esc(x.decision)}<div class="grid"><div><h3>原始候选图</h3>${crop}</div><div><h3>题库当前文本（只读）</h3><div class="candidate">${esc(x.content_text||'')}</div><h3>多路 LaTeX 候选</h3>${cs||'<div class="muted">尚无可用识别结果</div>'}<button onclick="review('${x.problem_id}','confirmed')">确认候选（不入库）</button><button class="reject" onclick="review('${x.problem_id}','rejected')">拒绝候选</button></div></div></section>`}
async function review(id,action){let note=prompt(action==='confirmed'?'确认说明（可留空）':'拒绝原因（可留空）')??'';try{let out=await api('/ocr-repair/reviews/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,note})});alert(out.question_bank_written?'异常：题库被写入':'已记录；题库未写入。');load()}catch(e){alert('操作失败：'+e.message)}} load();
</script></html>
