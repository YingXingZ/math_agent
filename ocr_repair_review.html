<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCR Repair 教师复核</title>
<style>body{font:16px system-ui,"Microsoft YaHei";max-width:1380px;margin:28px auto;background:#f6f8fb;color:#172033;padding:0 16px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(340px,1fr);gap:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.solution{grid-column:1/-1}textarea{font:15px ui-monospace,Consolas,monospace;min-height:110px;padding:9px;border:1px solid #b9c6d8;border-radius:7px;resize:vertical}.crop{max-width:100%;border:1px solid #ddd}.candidate{white-space:pre-wrap;background:#f8fafc;padding:10px;border-radius:8px;margin:8px 0;max-height:250px;overflow:auto}button{padding:8px 12px;border:0;border-radius:7px;background:#2563eb;color:white;cursor:pointer;margin:8px 8px 0 0}.reject{background:#b91c1c}.write{background:#087443}.muted{color:#64748b;font-size:13px}.risk{color:#b45309}.warning{color:#9a3412;background:#fff7ed;padding:9px;border-radius:7px}@media(max-width:850px){.grid,.fields{grid-template-columns:1fr}.field.solution{grid-column:auto}}</style>
<h1>OCR Repair · 教师复核与入库</h1><p>先对照左侧原图和下方三路候选，再编辑右侧字段。普通确认只记录审核；<b>确认并写回题库</b>才会保存你编辑后的题干、标准答案与解答。</p><button onclick="load()">刷新待复核项</button><div id="list">加载中…</div>
<script>
const base=location.pathname.startsWith('/ocr-repair')?'/api':'';
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(path,opt){let r=await fetch(base+path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
async function load(){let host=document.querySelector('#list');host.textContent='加载中…';try{let data=await api('/ocr-repair/reviews?status=pending');host.innerHTML=data.items.length?data.items.map(render).join(''):'<div class="card">没有待复核候选。</div>'}catch(e){host.textContent='读取失败：'+e.message}}
function field(id,label,value,klass=''){return `<label class="field ${klass}"><b>${label}</b><textarea id="${id}">${esc(value||'')}</textarea></label>`}
function render(x){let key='q-'+x.problem_id;let cs=x.candidates.map(c=>`<div class="candidate"><b>${esc(c.provider)}</b> · 置信度 ${Number(c.confidence||0).toFixed(2)}<br>${esc(c.latex_text||'未给出候选')}<div class="risk">${esc(c.risks_json||'')}</div></div>`).join('');let crop=x.anchor_id?`<img class="crop" src="${base}/ocr-repair/crops/${x.anchor_id}" alt="候选原图">`:'无候选裁图';return `<section class="card"><h2>${esc(x.section_no)} 第 ${esc(x.problem_no)} 题 · 推荐：${esc(x.decision)}</h2><div class="grid"><div><h3>原始答案书候选图</h3>${crop}<p class="warning">原图是最终依据。模型候选可能只含题干，也可能混合题干与解答。</p><h3>多路识别原文</h3>${cs||'<div class="muted">尚无可用识别结果</div>'}</div><div><h3>教师编辑后写回内容</h3><div class="fields">${field(key+'-content','题干 content',x.content_text)}${field(key+'-answer','标准答案 std_answer',x.std_answer)}${field(key+'-solution','完整解答 full_solution',x.full_solution,'solution')}</div><div class="muted">写回要求题干和标准答案均非空；系统会保留写回前后审计记录。</div><button onclick="review('${x.problem_id}','confirmed')">仅确认候选（不入库）</button><button class="reject" onclick="review('${x.problem_id}','rejected')">拒绝候选</button><button class="write" onclick="writeback('${x.problem_id}','${key}')">确认并写回题库</button></div></div></section>`}
async function review(id,action){let note=prompt(action==='confirmed'?'确认说明（可留空）':'拒绝原因（可留空）')??'';try{let out=await api('/ocr-repair/reviews/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,note})});alert(out.question_bank_written?'异常：题库被写入':'已记录；题库未写入。');load()}catch(e){alert('操作失败：'+e.message)}}
async function writeback(id,key){if(!confirm('将以当前编辑内容写入正式题库，并把答案状态设为 verified。已确认核对原图吗？'))return;let payload={confirm:true,content_text:document.getElementById(key+'-content').value,std_answer:document.getElementById(key+'-answer').value,full_solution:document.getElementById(key+'-solution').value,note:prompt('写回备注（建议记录原图核对结论，可留空）')??''};try{let out=await api('/ocr-repair/reviews/'+encodeURIComponent(id)+'/writeback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});alert(out.question_bank_written?'已写回题库，并记录审计。':'未写回。');load()}catch(e){alert('写回失败：'+e.message)}}
load();
</script></html>
