; supervisor 配置示例（Linux 生产守护）
; 安装: pip install supervisor && 将本文件放入 /etc/supervisor/conf.d/
; 启动: supervisord -c /etc/supervisor/supervisord.conf && supervisorctl update

[program:math-agent-8000]
command=/opt/gaoshu/venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1
directory=/opt/gaoshu/高数作业助手
environment=DATABASE_PATH="/opt/gaoshu/高数作业助手/data/homework.db"
autostart=true
autorestart=true
startsecs=5
user=math
stdout_logfile=/var/log/math/agent.out.log
stderr_logfile=/var/log/math/agent.err.log

[program:math-workbench-8014]
command=/opt/gaoshu/venv/bin/python /opt/gaoshu/run_workbench_8014.py
directory=/opt/gaoshu
environment=WORKBENCH_DB="/opt/gaoshu/高数教材答案/api.workbench.db",IMAGE_ROOT="/opt/gaoshu/extract_img"
autostart=true
autorestart=true
startsecs=5
user=math
stdout_logfile=/var/log/math/workbench.out.log
stderr_logfile=/var/log/math/workbench.err.log
