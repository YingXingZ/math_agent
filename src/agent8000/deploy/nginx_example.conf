# 高数作业助手 —— nginx 反向代理示例
# 公网只暴露 80/443，反代到本机 8000。8014 是证据库内网服务，禁止公网暴露。

upstream math_agent    { server 127.0.0.1:8000; }

server {
    listen 80;
    server_name math.example.com;   # 改成你的域名

    client_max_body_size 50m;        # 学生 PDF 上传上限（与 Agent 端 30MB 校验配合）
    proxy_read_timeout 300s;         # VLM 批改较慢
    proxy_connect_timeout 10s;

    # 主入口（学生/教师）
    location / {
        proxy_pass http://math_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

}

# HTTPS 生产配置请见 PRODUCTION_MULTI_TENANT.md：先用 certbot 获取证书，再将 80
# 重定向到 443。不要把 8014 / 18080 加到公网 location。

# 限流（防刷学生提交）：在 http 块定义后，对 /api/assignments/*/submissions 应用
# limit_req_zone $binary_remote_addr zone=submit:10m rate=5r/m;
# location = /api/assignments/.../submissions { limit_req zone=submit burst=5 nodelay; ... }
