# 高数作业助手 —— nginx 反向代理示例
# 公网只暴露 80/443，反代到本机 8000（主）与 8014（管理台）。

upstream math_agent    { server 127.0.0.1:8000; }
upstream math_workbench{ server 127.0.0.1:8014; }

server {
    listen 80;
    server_name math.example.com;   # 改成你的域名

    client_max_body_size 50m;        # 学生 PDF 上传上限（与 Agent 端 30MB 校验配合）
    proxy_read_timeout 300s;         # VLM 批改较慢
    proxy_connect_timeout 10s;

    # 主入口（学生/教师）
    location / {
        proxy_pass http://math_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 管理台：强烈建议加 IP 白名单或 Basic Auth
    location /workbench/ {
        # allow 10.0.0.0/8; deny all;          # 示例：仅内网
        # auth_basic "admin"; auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://math_workbench/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# 限流（防刷学生提交）：在 http 块定义后，对 /api/assignments/*/submissions 应用
# limit_req_zone $binary_remote_addr zone=submit:10m rate=5r/m;
# location = /api/assignments/.../submissions { limit_req zone=submit burst=5 nodelay; ... }
