<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>执行观测 · MathBench</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#11213a;font:15px "Microsoft YaHei",sans-serif}.bar{height:68px;background:#fff;border-bottom:1px solid #e7edf5;display:flex;align-items:center;padding:0 max(28px,calc((100vw - 1180px)/2));gap:18px}.brand{font-weight:800;font-size:20px}.brand b{display:inline-grid;place-items:center;width:31px;height:31px;margin-right:9px;border-radius:9px;background:#5146ed;color:#fff}.crumb{color:#7990ae}.wrap{max-width:980px;margin:42px auto;padding:0 22px}.back{display:inline-block;color:#5146df;text-decoration:none;margin-bottom:22px;font-weight:700}.head h1{margin:0;font-size:29px}.head p{color:#71849f;margin:10px 0 28px}.card{background:#fff;border:1px solid #e0e8f2;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 7px 20px #1b29420a}.event{border-left:3px solid #4f46e5;padding:12px 14px;margin:9px 0;background:#f8faff;border-radius:0 9px 9px 0}.bad{border-color:#e45b3c;background:#fff8f6}.hint,.meta{color:#71839e}.meta{display:block;margin-top:5px;font-size:13px}code{font-family:Consolas,monospace;color:#33415c}.empty{padding:24px;color:#71839e;text-align:center}@media(max-width:680px){.wrap{margin:26px auto}.bar{padding:0 18px}.head h1{font-size:24px}}</style><header class="bar"><div class="brand"><b>问</b>MathBench</div><span class="crumb">资料库与质量中心 / 执行观测</span></header><main class="wrap"><a class="back" href="/?panel=advancedTools">← 返回资料库与质量中心</a><div class="head"><h1>Agent 执行观测</h1><p>集中查看解题链路、步骤耗时及底层调用详情；不展示学生答案或标准答案。</p></div><div id="list" class="card">加载中…</div></main><script>const list=document.querySelector('#list'),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),latency=x=>x==null?'耗时：—':'耗时：'+esc(x)+' ms',version=x=>!x||typeof x!=='object'||!Object.keys(x).length?'版本：—':'版本：'+esc(JSON.stringify(x));fetch('/api/reports/agent-traces?limit=30').then(async r=>{let x=await r.json();if(!r.ok)throw Error(x.detail||'加载失败');return x}).then(rows=>{if(!rows.length){list.innerHTML='<div class="empty">尚无已发布错题的 Agent 调用记录。</div>';return}list.innerHTML=rows.map(t=>'<article class="card"><b>Trace '+esc(t.trace_id||'历史记录')+'</b><span class="hint"> · '+esc(t.created_at)+' · '+esc(t.mode)+'</span><span class="meta">Qwen：'+(t.qwen_used?'已调用':'未调用')+'；教师复核：'+(t.teacher_review_needed?'需要':'不需要')+'；'+latency(t.latency_ms)+'</span><div>'+t.events.map(e=>'<div class="event '+(e.error_code?'bad':'')+'"><code>'+esc(e.node)+'</code> → '+esc((e.skills||[]).join(', ')||'无技能调用')+'<span class="meta">'+latency(e.latency_ms)+' · '+version(e.skill_versions)+(e.error_code?' · 失败码：'+esc(e.error_code):'')+'</span></div>').join('')+'</div></article>').join('')}).catch(e=>list.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>')</script></html>
