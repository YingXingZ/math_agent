<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Agent 执行观测</title><style>body{font:15px "Microsoft YaHei";background:#f6f8fc;color:#102a43;margin:0}.box{max-width:1000px;margin:6vh auto}.card{background:#fff;border:1px solid #e4ebf3;border-radius:12px;padding:18px;margin:12px 0}.event{border-left:3px solid #2563eb;padding:7px 10px;margin:7px 0;background:#f8fbff}.bad{border-color:#dc2626}.hint{color:#60758a}code{font-family:Consolas,monospace}</style><main class="box"><a href="/agent-evaluation">← 返回评测面板</a><h1>Agent 执行观测</h1><p class="hint">不显示学生答案或标准答案；只显示流程、版本、耗时与失败码。</p><div id="list" class="card">加载中…</div></main><script>const list=document.querySelector('#list');const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));fetch('/api/reports/agent-traces?limit=30').then(async r=>{let x=await r.json();if(!r.ok)throw Error(x.detail||'加载失败');return x}).then(rows=>{if(!rows.length){list.textContent='尚无已发布错题的 Agent 调用记录。';return}list.innerHTML=rows.map(t=>'<article class="card"><b>Trace '+esc(t.trace_id||'历史记录')+'</b> · '+esc(t.created_at)+' · '+esc(t.mode)+' · '+esc(t.latency_ms)+' ms<br><span class="hint">Qwen：'+(t.qwen_used?'已调用':'未调用')+'；教师复核：'+(t.teacher_review_needed?'需要':'不需要')+'</span><div>'+t.events.map(e=>'<div class="event '+(e.error_code?'bad':'')+'"><code>'+esc(e.node)+'</code> → '+esc((e.skills||[]).join(', '))+' · '+esc(e.latency_ms)+' ms · '+esc(JSON.stringify(e.skill_versions||{}))+(e.error_code?' · 失败码：'+esc(e.error_code):'')+'</div>').join('')+'</div></article>').join('')}).catch(e=>list.textContent='加载失败：'+e.message)</script></html>
