<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的作业</title>
<style>
:root{--ink:#102a43;--muted:#60758a;--blue:#2563eb;--line:#dce6f0;--bg:#f5f8fc;--green:#047857;--amber:#a16207}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px "Microsoft YaHei",sans-serif;color:var(--ink)}.bar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 920px)/2));gap:12px}.brand{font-weight:800;font-size:19px}.links{display:flex;align-items:center;gap:8px}.links a,.links button{border:0;background:#eef4ff;color:#1d4ed8;border-radius:8px;padding:8px 10px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.links a.active{background:#2563eb;color:#fff}.box{max-width:920px;margin:34px auto;padding:0 20px 48px}.hero{background:linear-gradient(135deg,#123756,#194e76);color:#fff;border-radius:18px;padding:28px;margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:#dceafd;line-height:1.7}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{border:1px solid var(--line);border-radius:99px;background:#fff;padding:8px 13px;color:#31516b;font:inherit;cursor:pointer}.tabs button.active{background:#e8f1ff;color:#1d4ed8;border-color:#93b8ef}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-weight:800;font-size:18px}.meta,.hint{color:var(--muted);font-size:14px;line-height:1.7}.badge{white-space:nowrap;border-radius:99px;padding:5px 9px;font-size:13px;font-weight:700;background:#eef4ff;color:#1d4ed8}.badge.pending{background:#eff6ff;color:#1d4ed8}.badge.overdue,.badge.reviewing{background:#fff7e6;color:var(--amber)}.badge.released{background:#ecfdf5;color:var(--green)}.badge.grading,.badge.submitted{background:#f1f5f9;color:#475569}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:9px;padding:10px 13px;background:#2563eb;color:#fff;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}.btn.secondary{background:#eef4ff;color:#1d4ed8}.score{margin-top:10px;background:#f0fdf7;border-radius:10px;padding:10px;color:#075a40}.empty{background:#fff;border:1px dashed #b9c7d8;border-radius:14px;padding:26px;color:var(--muted);text-align:center}@media(max-width:640px){body{background:#fff}.bar{padding:0 14px;height:58px}.brand{font-size:16px}.box{margin:0;padding:0 14px 36px}.hero{border-radius:0;margin:0 -14px 14px;padding:24px 18px}.hero h1{font-size:25px}.card{padding:15px}.top{display:block}.badge{display:inline-block;margin-top:8px}.links{gap:5px}.links a,.links button{padding:7px 8px;font-size:13px}}
</style>
<header class="bar"><span class="brand">高数作业助手</span><nav class="links"><a class="active" href="/student">我的作业</a><a href="/mistakes?review=1">我的错题</a><button onclick="logout()">退出</button></nav></header>
<main class="box"><section class="hero"><h1>我的作业</h1><p>在这里查看老师发给本班的作业、提交进度和已发布成绩。成绩发布后，可从“我的错题”进入学习复盘。</p></section><div id="tabs" class="tabs"></div><section id="list">加载作业中…</section></main>
<script>
let all=[],filter='all';
const stateText={pending:'待提交',overdue:'已截止，仍可补交',submitted:'已提交，等待处理',grading:'正在智能初评',reviewing:'等待教师复核',released:'成绩已发布'};
function esc(v){let d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function fmt(v){try{return new Date(v).toLocaleString('zh-CN',{hour12:false})}catch{return v||''}}
function render(){
 const tabs=[['all','全部'],['pending','待提交'],['submitted','已提交'],['released','已发布成绩']];
 document.querySelector('#tabs').innerHTML=tabs.map(([k,t])=>'<button class="'+(filter===k?'active':'')+'" data-filter="'+k+'">'+t+'</button>').join('');
 document.querySelectorAll('[data-filter]').forEach(btn=>btn.onclick=()=>{filter=btn.dataset.filter;render()});
 const rows=all.filter(x=>filter==='all'||(filter==='submitted'?['submitted','grading','reviewing'].includes(x.state):x.state===filter));
 const list=document.querySelector('#list');
 if(!rows.length){list.innerHTML='<div class="empty">'+(filter==='pending'?'暂无待提交作业。':'这里暂时没有对应的作业记录。')+'</div>';return}
 list.innerHTML=rows.map(x=>{
   const quality=x.quality_score==null?'—':Number(x.quality_score).toFixed(1);
   const qmax=x.quality_max_score==null?'80':Number(x.quality_max_score).toFixed(1);
   const score=x.score==null?'—':Number(x.score).toFixed(1);
   const action=(x.state==='pending'||x.state==='overdue')?'<a class="btn" href="/submit?assignment_id='+x.id+'">查看作业并提交</a>':(x.state==='released'?'<a class="btn" href="/mistakes?review=1">查看错题与复盘</a>':'<a class="btn secondary" href="/submit?assignment_id='+x.id+'">查看提交记录</a>');
   const scoreBox=x.state==='released'?'<div class="score"><b>本次总评：'+score+' / '+Number(x.total_score||100).toFixed(0)+' 分</b><br><span class="hint">提交完成度 '+Number(x.completion_score||0).toFixed(0)+' / 20；答题质量 '+quality+' / '+qmax+'</span></div>':'';
   return '<article class="card"><div class="top"><div><div class="title">'+esc(x.title)+'</div><div class="meta">'+esc(x.chapter)+' · '+esc(x.class_name)+'<br>截止：'+fmt(x.due_at)+(x.submitted_at?'<br>提交：'+fmt(x.submitted_at):'')+'</div></div><span class="badge '+x.state+'">'+stateText[x.state]+'</span></div>'+scoreBox+'<div class="actions">'+action+'</div></article>'
 }).join('');
}
async function load(){let r=await fetch('/api/student/assignments');if(!r.ok)throw Error('请重新登录');let x=await r.json();all=x.assignments||[];render()}
async function logout(){try{await fetch('/api/auth/logout',{method:'POST'})}finally{location.replace('/login')}}
load().catch(e=>document.querySelector('#list').innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>');
</script></html>
