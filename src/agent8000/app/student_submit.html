<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>提交高数作业</title>
<style>body{margin:0;background:#f6f8fc;font:16px "Microsoft YaHei",sans-serif;color:#102a43}.box{max-width:620px;margin:9vh auto;background:#fff;border:1px solid #e4ebf3;border-radius:18px;padding:30px;box-shadow:0 12px 35px #102a4312}h1{margin-top:0}p{color:#60758a;line-height:1.7}label{display:block;font-weight:700;margin-top:15px}input{width:100%;box-sizing:border-box;margin-top:6px;padding:10px;border:1px solid #cdd9e6;border-radius:8px;font:inherit}button{margin-top:22px;padding:11px 16px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.note{margin-top:15px;padding:12px;background:#eef6ff;border-radius:10px;line-height:1.6}.err{background:#fff1f0;border-color:#ffccc7;color:#cf1322}.file-summary{margin-top:8px;padding:10px;border:1px solid #bfdbfe;border-radius:9px;background:#f8fbff;color:#31516b;line-height:1.6}.file-summary.warn{border-color:#f59e0b;background:#fffbeb;color:#92400e}</style>
<main class="box"><h1>提交高数作业</h1><p id="assignment">正在读取作业信息…</p><p class="note">需要手写作业单？<a id="printSheet" target="_blank" rel="noopener">打开并打印作业 PDF</a></p><div class="note" id="submissionStatus" style="display:none" aria-live="polite"></div><form id="form"><label>姓名<input name="student_name" required></label><label>学号<input name="student_no" required placeholder="仅限字母、数字、下划线" pattern="[A-Za-z0-9_]{1,32}"></label><label>从相册或文件选择全部作业图片 / PDF<input name="file" type="file" accept="image/*,application/pdf" multiple required></label><div id="fileSummary" class="file-summary warn" aria-live="polite">尚未选择文件。请一次选齐全部页面后再提交。</div><p class="note"><b>请检查页数：</b>可一次选择多张图片（最多 10 张），选择后下方会显示页数和文件名；如果只显示“1页”，服务器实际只能收到1页。PDF 请单独选择。</p><button id="btn" type="submit">确认页数并开始智能初评</button></form><div class="note" id="result">图片和 PDF 都支持。PDF 会自动逐页转为图片，再交给智能体识别。全部文件合计不超过 30MB。</div></main>
<script>
const id=new URLSearchParams(location.search).get('assignment_id');
const makeupToken=new URLSearchParams(location.search).get('makeup_token')||'';
const makeupQuery=makeupToken?'?makeup_token='+encodeURIComponent(makeupToken):'';
const result=document.getElementById('result');
const btn=document.getElementById('btn');
const form=document.getElementById('form');
const statusBox=document.getElementById('submissionStatus');
const fileInput=form.elements.file;
const fileSummary=document.getElementById('fileSummary');
let expectedQuestions=0;
const MAX=30*1024*1024;
document.getElementById('printSheet').href=id?'/api/assignments/'+id+'/pdf'+makeupQuery:'#';
function setMsg(text,isErr,isOk){result.textContent=text;result.className='note'+(isErr?' err':isOk?' ok':'');}
function showStatus(item){
  if(!item||!item.submission_id)return;
  if(item.state==='returned'){
    statusBox.replaceChildren();const title=document.createElement('strong');title.textContent='老师退回了这份作业，请补齐后重新上传';const reason=document.createElement('span');reason.textContent='退回原因：'+(item.return_reason||'请补齐缺交页面或题目后重新上传。');statusBox.append(title,document.createElement('br'),reason);statusBox.style.display='block';btn.textContent='补齐后重新上传';setMsg('请按老师说明补齐作业。重新上传后会生成新的提交记录，原提交及批改记录会保留。',false,false);return;
  }
  const labels={grading:['已成功提交，正在智能初评','作业已安全保存，正在智能初评。你可以退出此页，稍后仍可查看状态。'],reviewing:['已成功提交，等待老师复核','作业已安全保存，智能初评已完成，正在等待老师复核。'],released:['老师已发布成绩与反馈','本次作业已经完成批改，请返回学生工作台查看成绩与反馈。'],submitted:['已成功提交','作业已安全保存，等待后续处理。']};
  const state=labels[item.state]||labels.submitted;
  const time=item.submitted_at?new Date(item.submitted_at).toLocaleString():'刚刚';
  const workbenchLink='<a href="/student" style="display:inline-block;margin-top:10px;padding:8px 12px;border-radius:8px;background:#2563eb;color:#fff;text-decoration:none;font-weight:700">进入我的作业（学生工作台）</a>';
  statusBox.innerHTML='<strong>'+state[0]+'</strong><br><span>'+state[1]+' 提交时间：'+time+'。</span><br>'+workbenchLink;
  statusBox.style.display='block';
  form.querySelectorAll('input,button').forEach(function(el){el.disabled=true;});
}
async function loadMakeupDetail(){
  if(!makeupToken)return false;
  try{
    const r=await fetch('/api/student/assignments/'+id+'/detail'+makeupQuery,{cache:'no-store'});
    if(!r.ok)return false;
    const detail=await r.json();
    expectedQuestions=(detail.items||[]).length;
    document.getElementById('assignment').textContent=detail.title+'｜截止：'+new Date(detail.due_at).toLocaleString()+'｜补交通道';
    setMsg('这是老师发放的补交链接。请按班级名单填写姓名和学号后提交；链接到期后将自动失效。',false,false);
    return true;
  }catch(_err){return false;}
}
async function loadAssignment(){
  try{
    const r=await fetch('/api/student/assignments',{cache:'no-store'});
    if(!r.ok)throw new Error('无法读取作业状态');
    const data=await r.json();
    const item=(data.assignments||[]).find(function(x){return String(x.id)===id;});
    if(!item){
      if(await loadMakeupDetail())return;
      document.getElementById('assignment').textContent='当前账号尚未显示本作业。请填写教师名单中的姓名和学号：若信息一致且账号尚未绑定，提交时会自动关联；若不在本次指定名单中，系统会明确提示联系教师添加。';
      setMsg('请核对姓名和学号后再提交。首次使用也可直接通过教师发送的作业链接完成提交。',false,false);
      return;
    }
    document.getElementById('assignment').textContent=item.title+'｜截止：'+new Date(item.due_at).toLocaleString();
    form.elements.student_name.value=item.roster_name||'';
    form.elements.student_no.value=item.student_no||'';
    try{const detailResponse=await fetch('/api/student/assignments/'+id+'/detail',{cache:'no-store'});if(detailResponse.ok){const detail=await detailResponse.json();expectedQuestions=(detail.items||[]).length;}}
    catch(_detailErr){}
    showStatus(item);
  }catch(err){
    if(await loadMakeupDetail())return;
    document.getElementById('assignment').textContent='请填写教师名单中的姓名和学号后提交本次作业。';
    setMsg('首次使用或未登录时仍可通过教师发送的链接提交；系统会按姓名、学号和指定名单核验身份。',false,false);
  }
}
async function preflightImages(selected){
  const images=selected.filter(function(file){return /^image\//.test(file.type);});
  const warnings=[];
  for(const file of images){
    const data=await new Promise(function(resolve,reject){const reader=new FileReader();reader.onload=function(){resolve(reader.result)};reader.onerror=function(){reject(new Error('无法读取 '+file.name))};reader.readAsDataURL(file);});
    const image=await new Promise(function(resolve,reject){const probe=new Image();probe.onload=function(){resolve(probe)};probe.onerror=function(){reject(new Error('无法读取图片 '+file.name))};probe.src=data;});
    const shortEdge=Math.min(image.naturalWidth,image.naturalHeight);
    if(shortEdge<520)throw new Error(file.name+' 分辨率过低，请重新拍摄或选择原图。');
    if(shortEdge<900)warnings.push(file.name+' 较小，公式可能不清楚');
    if(image.naturalWidth>image.naturalHeight*1.8)warnings.push(file.name+' 为横向图片，请确认题号和完整作答均在画面内');
  }
  if(warnings.length&&!window.confirm('上传前检查：\n'+warnings.join('\n')+'\n\n仍要继续提交吗？'))throw new Error('已取消提交，请检查或重拍作业图片后再试。');
}
function renderFileSummary(){
  const selected=Array.from(fileInput.files||[]);
  if(!selected.length){fileSummary.className='file-summary warn';fileSummary.textContent='尚未选择文件。请一次选齐全部页面后再提交。';return;}
  const isPdf=selected.length===1&&/\.pdf$/i.test(selected[0].name);
  const countText=isPdf?'已选择1个PDF（PDF内部页数将在服务器核对）':'已选择 '+selected.length+' 页图片';
  fileSummary.className='file-summary'+(!isPdf&&selected.length===1?' warn':'');
  fileSummary.textContent=countText+'：'+selected.map(function(file){return file.name}).join('；')+(!isPdf&&selected.length===1?'。请确认全部作答确实只在这一页。':'');
}
fileInput.addEventListener('change',renderFileSummary);
function uploadSubmission(fd){
  return new Promise(function(resolve,reject){
    const xhr=new XMLHttpRequest();
    xhr.open('POST','/api/assignments/'+id+'/submissions');
    xhr.responseType='json';
    xhr.upload.onprogress=function(e){if(e.lengthComputable){const pct=Math.min(99,Math.round(e.loaded/e.total*100));setMsg('正在上传作业：'+pct+'%（请保持此页打开）',false,false);}};
    xhr.upload.onload=function(){setMsg('图片已传到服务器，正在归档并进入智能初评队列，请勿关闭页面…',false,false);};
    xhr.onerror=function(){reject(new Error('网络连接中断，未收到服务器确认。请重新进入本页查看提交状态后再决定是否重传。'));};
    xhr.onload=function(){
      const body=xhr.response||{};
      if(xhr.status<200||xhr.status>=300)reject(new Error(body.detail||'提交失败，请稍后重试'));
      else resolve(body);
    };
    xhr.send(fd);
  });
}
async function uploadJson(url,options){
  let response;
  try{response=await fetch(url,Object.assign({cache:'no-store'},options||{}));}
  catch(_err){throw new Error('网络中断，PDF 上传进度已保留。请保持同一文件，点“继续上传”。');}
  let body={};
  try{body=await response.json();}catch(_err){}
  if(!response.ok){
    const detail=typeof body.detail==='string'?body.detail:'服务器未接收请求（HTTP '+response.status+'）。请稍后继续上传。';
    throw new Error(detail);
  }
  return body;
}
async function uploadPdfInChunks(file,studentNo,studentName){
  const key='mathbench-pdf:'+id+':'+makeupToken+':'+studentNo+':'+file.name+':'+file.size+':'+file.lastModified;
  const base='/api/assignments/'+id+'/pdf-upload';
  let token=localStorage.getItem(key);
  let state;
  if(token){
    try{state=await uploadJson(base+'/'+token);}
    catch(_err){token=null;localStorage.removeItem(key);}
  }
  if(!token){
    state=await uploadJson(base,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_no:studentNo,student_name:studentName,filename:file.name,size:file.size,makeup_token:makeupToken})});
    token=state.upload_id;
    localStorage.setItem(key,token);
  }
  if(state.completed&&state.result){localStorage.removeItem(key);return state.result;}
  let offset=state.offset||0;
  if(offset>file.size)throw new Error('服务器上传进度异常，请重新选择文件。');
  const chunkBytes=2*1024*1024;
  let failures=0;
  while(offset<file.size){
    const next=Math.min(file.size,offset+chunkBytes);
    setMsg('正在上传 PDF：'+Math.round(offset/file.size*100)+'%（断线后可继续）',false,false);
    try{
      const step=await uploadJson(base+'/'+token,{method:'PUT',headers:{'X-Upload-Offset':String(offset),'Content-Type':'application/octet-stream'},body:file.slice(offset,next)});
      offset=step.offset;
      failures=0;
    }catch(err){
      failures++;
      try{const progress=await uploadJson(base+'/'+token);offset=progress.offset;if(progress.completed&&progress.result){localStorage.removeItem(key);return progress.result;}}
      catch(_statusErr){}
      if(failures>=3)throw new Error('PDF 网络连接多次中断，已保存 '+Math.round(offset/file.size*100)+'%。稍后选择同一文件，点“继续上传”即可。');
      await new Promise(function(resolve){setTimeout(resolve,1000*failures);});
    }
  }
  setMsg('PDF 已传完，正在核对并保存提交记录…',false,false);
  let result;
  try{result=await uploadJson(base+'/'+token+'/complete',{method:'POST'});}
  catch(err){
    const progress=await uploadJson(base+'/'+token);
    if(!progress.completed||!progress.result)throw err;
    result=progress.result;
  }
  localStorage.removeItem(key);
  return result;
}
if(!id){setMsg('缺少作业编号，请从老师发送的链接进入。',true,false);form.style.display='none';}
else{
  loadAssignment();
  form.onsubmit=async function(e){
    e.preventDefault();
    const selected=Array.from(form.elements.file.files||[]);
    if(!selected.length){setMsg('请先选择作业文件',true,false);return;}
    if(selected.length>10){setMsg('一次最多上传 10 张作业图片',true,false);return;}
    const total=selected.reduce(function(sum,file){return sum+file.size;},0);
    if(total>MAX){setMsg('所选文件合计 '+(total/1048576).toFixed(1)+'MB，超过 30MB 上限，请压缩后重试',true,false);return;}
    if(selected.length>1&&selected.some(function(file){return !/^image\//.test(file.type);})){setMsg('多页提交请仅选择 JPG 或 PNG 图片；PDF 请作为单个文件上传。',true,false);return;}
    if(selected.length===1&&/^image\//.test(selected[0].type)){
      const scope=expectedQuestions>1?'本作业包含 '+expectedQuestions+' 道题，':'';
      if(!window.confirm(scope+'你目前只选择了1张图片。\n\n如果还有其他页面，请点“取消”后重新一次选齐；只有全部作答确实都在这一张时才点“确定”。')){setMsg('已取消提交。请重新选择全部页面，看到正确页数后再提交。',true,false);return;}
    }
    try{await preflightImages(selected);}catch(err){setMsg(err.message||'图片检查未通过',true,false);return;}
    const fd=new FormData();
    fd.append('student_name',form.elements.student_name.value.trim());
    fd.append('student_no',form.elements.student_no.value.trim());
    if(makeupToken)fd.append('makeup_token',makeupToken);
    selected.forEach(function(file){fd.append('files',file,file.name);});
    btn.disabled=true;btn.textContent='上传中…';setMsg('正在准备上传，请保持此页打开…',false,false);
    try{
      const response=selected.length===1&&/\.pdf$/i.test(selected[0].name)
        ?await uploadPdfInChunks(selected[0],form.elements.student_no.value.trim(),form.elements.student_name.value.trim())
        :await uploadSubmission(fd);
      const qualityWarnings=(response.upload_quality||[]).flatMap(function(item){return item.warnings||[];});
      const qualityNote=qualityWarnings.length?' 上传提示：'+qualityWarnings.join('；')+'。':'';
      setMsg('已成功提交并保存（共 '+(response.page_count||selected.length)+' 页）。现在可以安全退出；重新进入本页仍可查看处理状态。'+qualityNote,false,true);
      form.reset();
      renderFileSummary();
      await loadAssignment();
    }catch(err){
      setMsg(err.message||'提交失败，请稍后重试',true,false);
      btn.disabled=false;btn.textContent='继续上传 / 重新提交';
    }
  };
}
</script></html>
