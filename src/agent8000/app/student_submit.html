<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>查看与提交高数作业</title>
<style>
:root{--ink:#102a43;--muted:#60758a;--blue:#2563eb;--line:#cdd9e6;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:#f6f8fc;font:16px "Microsoft YaHei",sans-serif;color:var(--ink)}.box{max-width:620px;margin:7vh auto;background:#fff;border:1px solid #e4ebf3;border-radius:18px;padding:30px;box-shadow:0 12px 35px #102a4312}h1{margin:0;font-size:28px}p{color:var(--muted);line-height:1.7}label{display:block;font-weight:700;margin-top:18px}input{width:100%;margin-top:7px;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;min-height:46px;background:#fff}input[type=file]{padding:9px}button{padding:11px 15px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer;min-height:44px}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#eaf1fb;color:#1d4ed8}.note{margin-top:18px;padding:14px;background:#eef6ff;border-radius:10px;line-height:1.65}.err{background:#fff1f0;border-color:#ffccc7;color:var(--red)}.logout{position:fixed;right:20px;top:14px;background:#475569;z-index:2}.pages{margin-top:12px;display:grid;gap:10px}.page{display:flex;gap:10px;padding:9px;border:1px solid var(--line);border-radius:10px;align-items:center}.page img{width:72px;height:72px;object-fit:cover;border-radius:7px;background:#eef2f6}.page .meta{min-width:0;flex:1}.page .meta b,.page .meta span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hint{color:var(--muted);font-size:14px;margin-top:4px}.warn{color:#9a6700}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{min-height:34px;padding:6px 9px;font-size:14px}.progress{height:9px;border-radius:99px;background:#e2e8f0;margin-top:12px;overflow:hidden}.progress>i{display:block;background:#2563eb;height:100%;width:0;transition:width .2s}.hidden{display:none}
@media(max-width:640px){body{background:#fff}.box{min-height:100dvh;margin:0;border:0;border-radius:0;box-shadow:none;padding:76px 20px 30px}h1{font-size:25px}p{font-size:15px}.logout{right:12px;top:12px;min-height:40px;padding:8px 12px;font-size:14px}button[type=submit]{width:100%;font-size:17px;margin-top:22px}.note{font-size:15px}.page img{width:62px;height:62px}.page{align-items:flex-start}.actions{justify-content:flex-end}}
</style>
<button class="logout" type="button" onclick="logout()">退出登录</button>
<main class="box"><a href="/student" class="hint" style="display:inline-block;text-decoration:none">← 返回我的作业</a><h1 style="margin-top:12px">查看与提交高数作业</h1><p id="assignment">正在读取作业信息…</p><section id="assignmentSheet" class="note">正在加载老师布置的题目…</section><div id="submitStart" class="actions" style="margin:16px 0"><button type="button" onclick="openSubmissionForm()">我已查看题目，开始提交作业</button></div>
<form id="form" class="hidden"><label>姓名<input name="student_name" required autocomplete="name"></label><label>学号<input name="student_no" required placeholder="仅限字母、数字、下划线" pattern="[A-Za-z0-9_]{1,32}"></label>
<label>拍照或选择作业页<input id="photoFiles" type="file" accept="image/png,image/jpeg,application/pdf" multiple capture="environment"></label>
<div class="hint">推荐一页一拍，题号和完整作答都要进入画面。图片会先在手机本地压缩、修正方向并检查清晰度；最多 10 页。PDF 请单独上传。</div>
<div id="pages" class="pages"></div><div id="progress" class="progress hidden"><i></i></div><button id="btn" type="submit">提交并开始智能初评</button></form>
<section id="submittedRecord" class="note hidden"></section>
<div class="note" id="result">可连续拍摄多页并调整顺序；服务器会按该顺序合并归档。提交失败后照片会保留，可直接重试。</div></main>
<script>window.MathJax={tex:{inlineMath:[["$","$"],["\\(","\\)"]],displayMath:[["$$","$$"],["\\[","\\]"]]},svg:{fontCache:"global"},startup:{typeset:false}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<script>
async function logout(){if(!confirm('确认退出当前账号？'))return;try{await fetch('/api/auth/logout',{method:'POST'})}finally{location.replace('/login')}}
const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('assignment_id'),result=document.getElementById('result'),btn=document.getElementById('btn'),form=document.getElementById('form'),picker=document.getElementById('photoFiles'),pagesBox=document.getElementById('pages'),progress=document.getElementById('progress'),record=document.getElementById('submittedRecord'),MAX=30*1024*1024;let pages=[];
function setMsg(text,isErr){result.textContent=text;result.className='note'+(isErr?' err':'')}
function sizeText(n){return n>1048576?(n/1048576).toFixed(1)+'MB':Math.ceil(n/1024)+'KB'}
function setProgress(n,visible=true){progress.classList.toggle('hidden',!visible);progress.firstElementChild.style.width=Math.max(0,Math.min(100,n))+'%'}
function clarity(canvas){const side=180,c=document.createElement('canvas'),scale=Math.min(1,side/Math.max(canvas.width,canvas.height));c.width=Math.max(2,Math.round(canvas.width*scale));c.height=Math.max(2,Math.round(canvas.height*scale));const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(canvas,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height).data;let total=0,count=0;for(let y=1;y<c.height;y+=2)for(let x0=1;x0<c.width;x0+=2){let k=(y*c.width+x0)*4,kl=(y*c.width+x0-1)*4,ku=((y-1)*c.width+x0)*4;let lum=i=>d[i]*.299+d[i+1]*.587+d[i+2]*.114;total+=Math.abs(lum(k)-lum(kl))+Math.abs(lum(k)-lum(ku));count+=2}return count?total/count:0}
function loadImage(file){return new Promise((resolve,reject)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(u);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(u);reject(new Error('图片无法读取'))};img.src=u})}
async function optimizeImage(file){let img=await loadImage(file),max=2048,ratio=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*ratio)),h=Math.max(1,Math.round(img.naturalHeight*ratio));let canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);let score=clarity(canvas),blob=await new Promise(ok=>canvas.toBlob(ok,'image/jpeg',.86));if(!blob)throw new Error('图片压缩失败');let name=(file.name||'作业页').replace(/\.[^.]+$/,'')+'.jpg';return {file:new File([blob],name,{type:'image/jpeg'}),url:URL.createObjectURL(blob),score,w,h}}
function renderPages(){pagesBox.innerHTML=pages.map((p,i)=>{let warn=p.score!=null&&p.score<10?'<span class="hint warn">清晰度偏低，建议重拍</span>':'<span class="hint">清晰度正常</span>';return '<div class="page"><img src="'+p.url+'" alt="第 '+(i+1)+' 页预览"><div class="meta"><b>第 '+(i+1)+' 页 · '+sizeText(p.file.size)+'</b>'+warn+'</div><div class="actions"><button class="secondary" type="button" '+(i===0?'disabled':'')+' onclick="movePage('+i+',-1)">上移</button><button class="secondary" type="button" '+(i===pages.length-1?'disabled':'')+' onclick="movePage('+i+',1)">下移</button><button class="secondary" type="button" onclick="removePage('+i+')">删除</button></div></div>'}).join('')}
function movePage(i,d){let j=i+d;if(j<0||j>=pages.length)return;[pages[i],pages[j]]=[pages[j],pages[i]];renderPages()}
function removePage(i){URL.revokeObjectURL(pages[i].url);pages.splice(i,1);renderPages()}
picker.onchange=async()=>{const chosen=[...picker.files];picker.value='';if(!chosen.length)return;if(chosen.some(f=>f.type==='application/pdf')){if(chosen.length!==1||pages.length){setMsg('PDF 必须单独上传，不能与图片混合。',true);return}pages=[{file:chosen[0],url:'',score:null,pdf:true}];pagesBox.innerHTML='<div class="page"><div class="meta"><b>PDF 作业 · '+sizeText(chosen[0].size)+'</b><span class="hint">将按 PDF 页序提交</span></div><div class="actions"><button class="secondary" type="button" onclick="removePage(0)">删除</button></div></div>';return}if(pages.some(p=>p.pdf)){setMsg('已选择 PDF；请先删除 PDF 后再添加图片。',true);return}if(pages.length+chosen.length>10){setMsg('一次最多 10 页图片。',true);return}setMsg('正在本机压缩与检查图片…',false);try{for(const file of chosen){if(!/^image\/(jpeg|png)$/.test(file.type))throw new Error('仅支持 JPG、PNG 或 PDF');pages.push(await optimizeImage(file))}renderPages();let bad=pages.filter(p=>p.score!=null&&p.score<10).length;setMsg(bad?'已加入 '+pages.length+' 页，其中 '+bad+' 页偏模糊，建议重拍后替换。':'已加入 '+pages.length+' 页，可调整页序后提交。',false)}catch(e){setMsg(e.message,true)}}
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function openSubmissionForm(){form.classList.remove('hidden');$('submitStart').classList.add('hidden');form.scrollIntoView({behavior:'smooth',block:'start'});}
async function loadAssignmentSheet(){
  const sheet=$('assignmentSheet');
  try{
    const r=await fetch('/api/student/assignments/'+encodeURIComponent(id)+'/detail');const x=await r.json();if(!r.ok)throw Error(x.detail||'读取题目失败');
    const items=x.items||[];
    sheet.innerHTML='<h2 style="margin:0 0 10px;font-size:20px">本次作业题目</h2><p class="hint">共 '+items.length+' 道，满分 '+esc(x.total_score??'—')+' 分。请完成后拍照上传你的完整作答。</p>'+items.map((q,i)=>'<article style="border-top:1px solid #dbe5f0;padding:15px 0"><b>第 '+esc(q.label||i+1)+' 题 · '+esc(q.score??'—')+' 分</b><div class="assignment-question" style="white-space:pre-wrap;line-height:1.8;margin-top:8px">'+esc(q.content)+'</div></article>').join('');
    if(window.MathJax?.typesetPromise){MathJax.typesetClear?.([sheet]);await MathJax.typesetPromise([sheet]);}
  }catch(e){sheet.className='note err';sheet.textContent='作业题目读取失败：'+e.message;}
}
async function submitPages(){if(!pages.length){setMsg('请先拍照或选择作业文件。',true);return}let total=pages.reduce((n,p)=>n+p.file.size,0);if(total>MAX){setMsg('照片总大小 '+sizeText(total)+' 超过 30MB，请删除部分页面或重新拍摄。',true);return}let fd=new FormData();fd.append('student_name',form.student_name.value.trim());fd.append('student_no',form.student_no.value.trim());pages.forEach(p=>fd.append('files',p.file,p.file.name));btn.disabled=true;btn.textContent='上传中…';setProgress(0);setMsg('正在上传，照片会按当前顺序归档并开始初评…',false);try{let x=await new Promise((resolve,reject)=>{let xhr=new XMLHttpRequest();xhr.open('POST','/api/assignments/'+encodeURIComponent(id)+'/submissions');xhr.upload.onprogress=e=>{if(e.lengthComputable)setProgress(Math.round(e.loaded/e.total*100))};xhr.onerror=()=>reject(new Error('网络连接中断，请检查网络后直接重试'));xhr.onload=()=>{let data={};try{data=JSON.parse(xhr.responseText||'{}')}catch{};xhr.status>=200&&xhr.status<300?resolve(data):reject(new Error(data.detail||'提交失败'))};xhr.send(fd)});setProgress(100);setMsg('提交成功：共 '+(x.page_count||pages.length)+' 页。'+(x.completion_score?'本次已记录提交完成度 '+x.completion_score+' / 20 分；':'')+'老师完成复核后会发布总评与错题反馈。',false);pages.forEach(p=>p.url&&URL.revokeObjectURL(p.url));pages=[];pagesBox.innerHTML='';form.reset()}catch(e){setMsg(e.message+' 已保留当前照片，你可以直接再次点击提交。',true)}finally{btn.disabled=false;btn.textContent='提交并开始智能初评';setTimeout(()=>setProgress(0,false),700)}}
if(!id){setMsg('缺少作业编号，请从老师发送的链接进入。',true);form.style.display='none'}else{fetch('/api/student/assignments').then(r=>r.json()).then(data=>{let a=(data.assignments||[]).find(x=>String(x.id)===id);if(!a)throw Error('未找到本班作业');document.getElementById('assignment').textContent=a.title+'｜截止：'+new Date(a.due_at).toLocaleString();loadAssignmentSheet();form.student_name.value=a.roster_name||'';form.student_no.value=a.student_no||'';form.student_name.readOnly=true;form.student_no.readOnly=true;form.student_name.title='已按班级名单自动填写';form.student_no.title='已按班级名单自动填写';if(a.submission_id){form.style.display='none';$('submitStart').classList.add('hidden');record.classList.remove('hidden');let labels={submitted:'已提交，等待处理',grading:'正在智能初评',reviewing:'等待教师复核',released:'成绩已发布'};record.innerHTML='<b>这份作业已经提交</b><br>提交时间：'+new Date(a.submitted_at).toLocaleString()+'<br>当前状态：'+(labels[a.state]||'处理中')+'<p><a class="secondary" style="display:inline-block;text-decoration:none;padding:9px 12px;border-radius:9px" href="/api/student/submissions/'+encodeURIComponent(a.submission_id)+'/file" target="_blank">打开 / 下载我提交的原作业</a></p>'+ (a.state==='released'?'成绩已发布，请返回“我的作业”后进入错题复盘。':'老师完成复核后，成绩会显示在“我的作业”中。');setMsg('你正在查看已提交记录，不能重复覆盖原作业。',false)}}).catch(e=>{setMsg('读取作业失败：'+e.message,true);form.style.display='none'});form.onsubmit=e=>{e.preventDefault();submitPages()}}
</script></html>
