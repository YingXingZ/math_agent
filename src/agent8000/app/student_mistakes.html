<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>我的错题复盘</title>
<script>window.MathJax={tex:{inlineMath:[["$","$"],["\\(","\\)"]],displayMath:[["$$","$$"],["\\[","\\]"]]},svg:{fontCache:"global"},startup:{typeset:false}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
.feedback-card{background:#f8fbff;border:1px solid #d9e8fb;border-radius:10px;padding:12px 14px;margin:12px 0}.tier{display:inline-block;border-radius:999px;padding:4px 10px;background:#e0ecff;color:#1d4ed8;font-weight:700}.tier.excellent{background:#dcfce7;color:#166534}.tier.good{background:#e0f2fe;color:#075985}.tier.keep_practicing{background:#fef3c7;color:#92400e}.feedback-card p{margin:8px 0;line-height:1.65}.learning-resources{margin:10px 0 0;padding-left:18px}.learning-resources a{color:#1d4ed8;line-height:1.8}
body{font:16px "Microsoft YaHei";background:#f6f8fc;color:#102a43;margin:0}.box{max-width:850px;margin:5vh auto;padding:20px}.card{background:#fff;border:1px solid #e4ebf3;border-radius:14px;padding:20px;margin:14px 0}.item{border-top:1px solid #e8eef5;padding:16px 0}.hint{color:#60758a;line-height:1.6}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:9px 13px;font-weight:bold;cursor:pointer}button.secondary{background:#475569}button.solution{background:#7c3aed}.out,.status{white-space:pre-wrap;background:#eef6ff;padding:12px;border-radius:8px;margin-top:10px;line-height:1.65}.rubric-details{margin-top:12px;padding-top:10px;border-top:1px solid #cdd9e6}.rubric-details summary{cursor:pointer;color:#1d4ed8;font-weight:700}.rubric-details pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;border:1px solid #cdd9e6;border-radius:7px;padding:9px;font:12px ui-monospace,monospace;color:#102a43}.math-content{white-space:pre-wrap;line-height:1.7}.conflict{background:#fff3cd;color:#7a4b00}
mjx-container{max-width:100%!important;overflow-x:auto!important;font-size:110%!important}mjx-container[jax="SVG"] svg{max-width:100%!important;height:auto!important}.logout{position:fixed;right:20px;top:14px;background:#475569;margin:0;z-index:2}
</style>
<button class="logout" type="button" onclick="logout()">退出登录</button><main class="box"><a href="/student">← 我的作业</a><h1>我的错题复盘</h1><p class="hint">这里展示教师已发布的逐题评价、表现档位和复习建议。待确认内容不会显示确定的对错结论。</p><div id="list" class="card">加载中…</div></main>
<script>
async function logout(){
  if(!confirm('确认退出当前账号？'))return;
  try{await fetch('/api/auth/logout',{method:'POST'});}finally{location.replace('/login');}
}
const box=document.querySelector('#list');
const text=(label,value)=>{const p=document.createElement('p');p.textContent=label+value;return p};
function plainMathFallback(value){return String(value||'').replace(/\\(?:begin|end)\{[^}]*\}/g,'').replace(/\\[a-zA-Z]+(?:\{[^{}]*\})?/g,'').replace(/[{}]/g,'').replace(/&/g,' ')}
async function typesetMath(node){const source=node.dataset.mathSource||node.textContent||'';try{if(window.MathJax?.typesetPromise){MathJax.typesetClear?.([node]);await MathJax.typesetPromise([node]);if(node.querySelector('mjx-merror')){MathJax.typesetClear?.([node]);node.textContent=plainMathFallback(source)}}}catch(_){node.textContent=plainMathFallback(source)}}
function mathText(label,value){const p=document.createElement('p');const strong=document.createElement('b');strong.textContent=label;const content=document.createElement('span');content.className='math-content';content.textContent=normalizeStudentMath(value);content.dataset.mathSource=content.textContent;p.append(strong,content);requestAnimationFrame(()=>typesetMath(content));return p};
function proofEvidence(value){
  const s=String(value||'').replace(/[\s$\\{}()\[\]，,。；;：:]/g,'').toLowerCase();
  return s.includes('h-x=f-x-fx=-hx')||(s.includes('h-x')&&s.includes('f-x-fx')&&s.includes('-hx'));
}
function preliminary(question){
  const raw=String(question.recognized_work||'');
  if(!proofEvidence(raw)) return null;
  const n=raw.replace(/[\s$\\{}()\[\]，,。；;：:]/g,'').toLowerCase();
  const hasFormula=n.includes('fx=')&&n.includes('gx')&&n.includes('hx')&&(raw.includes('1/2')||n.includes('12')||n.includes('frac12'));
  const hasConclusion=raw.includes('偶函数')&&raw.includes('奇函数')&&(raw.includes('表示')||raw.includes('和'));
  const part2=hasFormula&&hasConclusion?'confirmed':'missing';
  const feedback=String(question.feedback||'').replace(/\s/g,'');
  const stalePart1=/没有正确地证明h|未证明h|h\(x\)是否奇函数|未能正确/.test(feedback);
  const negativePart2=/第（2）问错误|第\(2\)问错误|未完成第（2）问|未完成第\(2\)问|缺少分解公式/.test(feedback);
  const conflict=stalePart1||(part2==='confirmed'&&negativePart2);
  const text=part2==='confirmed'
    ?'第（1）问和第（2）问均已识别到关键证据：奇偶性证明、分解公式与结论完整。'+(conflict?'\n\n评分证据冲突，待教师确认：原始反馈与当前识别证据不一致。':'')
    :'第（1）问识别为正确。第（2）问当前作答中未识别到分解公式与结论。\n你可以直接查看提示或完整推导，无需等待教师确认。';
  return {conflict,text};
}
function studentVisibleText(value){
  return String(value||'暂无反馈').split(/\n\n(?:成绩状态|分问核对|运行记录)：/)[0].trim();
}
function normalizeStudentMath(value){
  return studentVisibleText(value).replace(/\\n/g,'\n').replace(/\\r/g,'\n').replace(/\\+(?=[()[\]])/g,'\\')
    .replace(/\\(?:left|right)\b/g,'').replace(/\\begin\{align\*?\}/g,'\\begin{aligned}').replace(/\\end\{align\*?\}/g,'\\end{aligned}').replace(/&/g,' ')
    .replace(/\\\[/g,()=> '$$').replace(/\\\]/g,()=> '$$')
    .replace(/\\\(/g,()=> '$').replace(/\\\)/g,()=> '$');
}
async function showResult(payload,out){
  const safe=normalizeStudentMath(payload.response);
  out.textContent=safe;
  out.dataset.mathSource=safe;
  // Only Agent output is typeset.  Never typeset the full card, student OCR,
  // teacher feedback, or status banners: those fields may contain raw OCR
  // escaping that can create an oversized MathJax SVG.
  try{
    if(window.MathJax?.typesetPromise){
      MathJax.typesetClear?.([out]);
      await typesetMath(out);
    }
  }catch(_){out.textContent=plainMathFallback(safe)}
  const rubric=String(payload.rubric_details||'').trim();
  if(rubric.startsWith('[')){
    const details=document.createElement('details');details.className='rubric-details';
    const summary=document.createElement('summary');summary.innerHTML='&#x67e5;&#x770b;&#x8bc4;&#x5206;&#x89c4;&#x5219;&#x8be6;&#x60c5;';
    const raw=document.createElement('pre');raw.textContent=rubric;
    details.append(summary,raw);out.append(details);
  }
}
async function review(submissionId,questionId,sortOrder,subpartNo,mode,out){
  out.textContent=mode==='solution'?'正在读取题库答案…':'Agent 正在复盘…';
  try{
    const response=await fetch('/api/student/released-submissions/'+submissionId+'/mistakes/'+questionId+'/review?sort_order='+encodeURIComponent(sortOrder)+'&subpart_no='+encodeURIComponent(subpartNo||''),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode})});
    const payload=await response.json();
    if(!response.ok) throw Error(payload.detail||'调用失败');
    await showResult(payload,out);
  }catch(error){out.textContent='暂时无法获取复盘内容：'+error.message}
}
function addMistake(parent,submission,question,index,pending=false){
  const item=document.createElement('div');item.className='item';
  const card=question.feedback_card;
  item.append(Object.assign(document.createElement('b'),{textContent:(pending?'待教师确认':(card?.tier||'逐题评价'))+(question.problem_no?' · '+question.problem_no:'')}));
  item.append(mathText('题目：',question.content||'题干暂缺'));
  item.append(mathText('本题得分：',String(question.score??'—')+' / '+String(question.max_score??'—')));
  if(pending){const waiting=document.createElement('div');waiting.className='status conflict';waiting.textContent=question.pending_reason||'此题待教师确认。';item.append(waiting);parent.append(item);return}
  if(card){
    const summary=document.createElement('div');summary.className='feedback-card';
    const tier=document.createElement('span');tier.className='tier '+(card.tier_key||'');tier.textContent=card.tier||'逐题评价';summary.append(tier);
    summary.append(mathText('作答表现：',card.strength||''));
    if(card.evaluation)summary.append(mathText(question.teacher_feedback?'教师逐题评价：':'作答评价：',card.evaluation));
    summary.append(mathText('下一步建议：',card.next_step||''));
    (card.knowledge_points||[]).forEach(point=>summary.append(mathText('复习知识点：',point)));
    const resources=question.learning_resources||[];
    if(resources.length){
      const label=document.createElement('p');label.textContent='教材与学习资料：';summary.append(label);
      const list=document.createElement('ul');list.className='learning-resources';
      resources.forEach(resource=>{const li=document.createElement('li');const link=document.createElement('a');link.href=resource.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=(resource.title||'教材')+' · '+(resource.section||'章节')+' · 第 '+(resource.pages||'')+' 页';li.append(link);list.append(li)});
      summary.append(list);
    }
    item.append(summary);
  }
  const pre=preliminary(question);
  if(question.teacher_feedback&&!card)item.append(mathText('教师批注：',question.teacher_feedback));
  if(question.feedback && question.feedback!==question.teacher_feedback)item.append(mathText(pre?.conflict?'系统评语（待教师确认）：':'系统参考意见：',question.feedback));
  item.append(mathText('识别到你的作答：',question.recognized_work||'未识别'));
  if(pre){const status=document.createElement('div');status.className='status '+(pre.conflict?'conflict':'');status.textContent=pre.text;item.append(status)}
  if(question.review_available){
    const actions=document.createElement('div');actions.className='actions';
    const out=document.createElement('div');out.className='out';out.textContent='选择一种复盘方式开始。';
    [['diagnose','分析我错在哪',''],['hint','给我下一步提示','secondary'],['solution','查看答案','solution']].forEach(([mode,label,style])=>{const button=document.createElement('button');button.textContent=label;button.className=style;button.onclick=()=>review(submission.id,question.question_id,question.sort_order,question.subpart_no,mode,out);actions.append(button)});
    item.append(actions,out);
    item.insertBefore(actions,item.children[2]);item.insertBefore(out,item.children[3]);
  }else item.append(text('','该题尚未关联可靠题库原题，暂不提供自动复盘。'));
  parent.append(item);
}
async function load(){
  const submissionsResponse=await fetch('/api/student/released-submissions');
  if(!submissionsResponse.ok){box.textContent='请先以学生账号登录。';return}
  const submissions=await submissionsResponse.json();
  if(!submissions.length){box.textContent='老师暂未发布作业结果。';return}
  box.textContent='';
  for(const submission of submissions){
    const section=document.createElement('section');const title=document.createElement('h2');title.textContent=submission.title+' · 总评 '+(submission.score??'待确认')+' / '+(submission.max_score??100)+' 分';section.append(title);
    const breakdown=document.createElement('p');breakdown.className='hint';breakdown.textContent='成绩构成：提交完成度 '+(submission.completion_score??0)+' / 20；答题质量 '+(submission.quality_score??'—')+' / '+(submission.quality_max_score??80)+'。';section.append(breakdown);
    if(String(submission.feedback||'').trim()) section.append(mathText('教师整体批注：',submission.feedback));
    const mistakesResponse=await fetch('/api/student/released-submissions/'+submission.id+'/mistakes');
    const mistakes=await mistakesResponse.json();
    if(!mistakesResponse.ok)section.append(text('',mistakes.detail||'逐题评价加载失败'));
    else if(mistakes.question_feedback?.length){
      section.append(text('h3','逐题评价'));
      mistakes.question_feedback.forEach((question,index)=>addMistake(section,submission,question,index,question.feedback_status==='pending_confirmation'));
    }else if(!mistakes.mistakes?.length)section.append(text('','本次没有逐题批改记录。'));
    else mistakes.mistakes.forEach((question,index)=>addMistake(section,submission,question,index));
    box.append(section);
  }
}
load().catch(error=>{box.textContent='加载失败：'+error.message});
</script></html>
