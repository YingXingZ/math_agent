<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>激活学生账号</title><style>body{font:16px "Microsoft YaHei",sans-serif;background:#f6f8fc;color:#102a43;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:#fff;border:1px solid #e4ebf3;border-radius:16px;padding:28px;width:min(460px,92vw)}label{display:block;font-weight:700;margin-top:12px}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cdd9e6;border-radius:8px;margin-top:5px;font:inherit}button{margin-top:20px;background:#2563eb;color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:700}.error{color:#b91c1c;margin-top:12px}</style><main class="card"><h1>激活学生账号</h1><p>邀请码会和教师已导入的学号、姓名核验后才可激活。</p><form id="form"><label>邀请码<input name="invite_code" required></label><label>学号<input name="student_no" required></label><label>姓名<input name="name" required></label><label>登录名<input name="username" required></label><label>设置密码（至少 10 位）<input name="password" type="password" minlength="10" required></label><button>激活并登录</button></form><div id="msg" class="error"></div></main><script>const code=new URLSearchParams(location.search).get('code');if(code)document.querySelector('[name=invite_code]').value=code;document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/student-activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(!r.ok){document.querySelector('#msg').textContent=(await r.json()).detail||'激活失败';return}location.href='/submit'}</script></html>
