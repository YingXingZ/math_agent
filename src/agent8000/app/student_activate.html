<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>激活学生账号</title><style>
:root{--ink:#102a43;--muted:#60758a;--blue:#2563eb;--line:#cdd9e6}*{box-sizing:border-box}body{font:16px "Microsoft YaHei",sans-serif;background:#f6f8fc;color:var(--ink);margin:0;display:grid;place-items:center;min-height:100dvh;padding:24px}.card{background:#fff;border:1px solid #e4ebf3;border-radius:18px;padding:30px;width:min(460px,100%);box-shadow:0 12px 32px #102a4314}h1{margin:0;font-size:28px}p{color:var(--muted);line-height:1.7}label{display:block;font-weight:700;margin-top:18px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:7px;font:inherit;min-height:46px}button{width:100%;margin-top:24px;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;min-height:46px}.error{color:#b91c1c;margin-top:12px;min-height:1.5em}@media(max-width:640px){body{padding:0;background:#fff;display:block}.card{min-height:100dvh;width:100%;border:0;border-radius:0;box-shadow:none;padding:88px 24px 32px}h1{font-size:26px}p,.error{font-size:15px}button{font-size:17px}}</style>
<main class="card"><h1>激活账号并提交</h1><p id="intro">邀请码会与教师导入的学号、姓名核验；激活后将自动进入本次作业。</p><form id="form"><label id="codeLabel">邀请码<input name="invite_code" required></label><label>学号<input name="student_no" required autocomplete="username"></label><label>姓名<input name="name" required></label><label>设置登录名<input name="username" required autocomplete="username"></label><label>设置密码（至少 10 位）<input name="password" type="password" minlength="10" required autocomplete="new-password"></label><button id="btn">激活并进入作业</button></form><div id="msg" class="error" role="alert"></div></main><script>
const params=new URLSearchParams(location.search),code=params.get('code'),next=params.get('next')||'',form=document.querySelector('#form'),msg=document.querySelector('#msg'),btn=document.querySelector('#btn');
if(code){const field=document.querySelector('[name=invite_code]');field.value=code;field.readOnly=true;document.querySelector('#codeLabel').style.display='none';}
const safeNext=/^\/submit\?assignment_id=\d+$/.test(next)?next:'/mistakes';
form.onsubmit=async e=>{e.preventDefault();msg.textContent='';btn.disabled=true;btn.textContent='激活中…';try{const r=await fetch('/api/auth/student-activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});let x={};try{x=await r.json()}catch(_e){}if(!r.ok){msg.textContent=x.detail||'激活失败，请核对学号、姓名和邀请码。';return}location.replace(safeNext)}catch(_e){msg.textContent='网络连接异常，请稍后重试。'}finally{btn.disabled=false;btn.textContent='激活并进入作业'}};
</script></html>
