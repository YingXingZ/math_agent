<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重置学生密码 · MathBench</title>
<style>:root{--ink:#14213a;--muted:#72839e;--purple:#5146e5;--line:#ccd8e7}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font:16px "Microsoft YaHei",sans-serif}.box{max-width:440px;margin:10vh auto;padding:28px;background:#fff;border:1px solid #e2e9f2;border-radius:16px;box-shadow:0 12px 30px #15233d10}h1{margin:0 0 10px;font-size:24px}.hint{color:var(--muted);line-height:1.65}label{display:block;margin-top:16px;font-weight:700}input{width:100%;margin-top:7px;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit}.match{margin:9px 0 0;font-size:13px;color:var(--muted)}.match.ok{color:#087f75}.match.bad{color:#bd3c54}.options{margin-top:13px;display:flex;align-items:center;gap:8px;color:#52657d;font-size:13px}.options input{width:auto;margin:0}button{margin-top:22px;width:100%;border:0;border-radius:9px;padding:12px;background:var(--purple);color:#fff;font-weight:800;font-size:15px;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}#msg{margin-top:14px;color:#61748d}@media(max-width:520px){body{padding:18px 0}.box{margin:18vh 0 0;border-radius:16px;padding:28px 24px}}</style></head>
<body><main class="box"><h1>重置密码</h1><p class="hint">此链接仅能使用一次，且将在生成后 24 小时失效。重置不会影响其他同学或你的账号资料。</p><form id="form"><label>新密码<input id="password" type="password" minlength="10" required placeholder="至少 10 位" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false"></label><label>确认新密码<input id="confirm" type="password" minlength="10" required autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false"></label><p id="match" class="match">请再次输入相同密码。</p><label class="options"><input id="show" type="checkbox"> 显示密码，核对两次输入</label><button id="submit" type="submit">更新密码</button></form><p id="msg"></p></main>
<script>const token=new URLSearchParams(location.search).get('token')||'',msg=document.querySelector('#msg'),form=document.querySelector('#form'),p=document.querySelector('#password'),c=document.querySelector('#confirm'),match=document.querySelector('#match'),show=document.querySelector('#show'),submit=document.querySelector('#submit');function check(){if(!c.value){match.textContent='请再次输入相同密码。';match.className='match';return false}const same=p.value===c.value;match.textContent=same?'两次密码一致。':'两次密码不一致；请显示密码核对大小写、空格和符号。';match.className='match '+(same?'ok':'bad');return same}p.addEventListener('input',check);c.addEventListener('input',check);show.addEventListener('change',()=>{const type=show.checked?'text':'password';p.type=type;c.type=type});form.onsubmit=async e=>{e.preventDefault();if(!check()){msg.textContent='请先使两次密码完全一致。';return}submit.disabled=true;msg.textContent='正在更新…';try{const r=await fetch('/api/auth/student-password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p.value})}),x=await r.json();if(!r.ok)throw Error(x.detail||'重置失败');msg.textContent='密码已更新，正在跳转登录页…';setTimeout(()=>location.href='/login',900)}catch(err){msg.textContent=err.message;submit.disabled=false}};</script></body></html>
