<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重置学生密码 · MathBench</title><style>body{margin:0;background:#f5f7fb;color:#14213a;font:16px "Microsoft YaHei",sans-serif}.box{max-width:440px;margin:10vh auto;padding:28px;background:#fff;border:1px solid #e2e9f2;border-radius:16px;box-shadow:0 12px 30px #15233d10}h1{margin:0 0 10px;font-size:24px}.hint{color:#72839e;line-height:1.65}label{display:block;margin-top:16px;font-weight:700}input{box-sizing:border-box;width:100%;margin-top:7px;padding:11px;border:1px solid #ccd8e7;border-radius:9px;font:inherit}button{margin-top:22px;width:100%;border:0;border-radius:9px;padding:12px;background:#5146e5;color:#fff;font-weight:800;font-size:15px;cursor:pointer}#msg{margin-top:14px;color:#61748d}</style><main class="box"><h1>重置密码</h1><p class="hint">此链接仅能使用一次，且将在生成后 24 小时失效。重置不会影响其他同学或你的账号资料。</p><form id="form"><label>新密码<input id="password" type="password" minlength="10" required placeholder="至少 10 位"></label><label>确认新密码<input id="confirm" type="password" minlength="10" required></label><button>更新密码</button></form><p id="msg"></p></main><script>const token=new URLSearchParams(location.search).get('token')||'',msg=document.querySelector('#msg');document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const p=password.value;if(p!==confirm.value){msg.textContent='两次输入的密码不一致。';return}try{const r=await fetch('/api/auth/student-password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})}),x=await r.json();if(!r.ok)throw Error(x.detail||'重置失败');msg.textContent='密码已更新，正在跳转登录页…';setTimeout(()=>location.href='/login',900)}catch(err){msg.textContent=err.message}};</script></html>
