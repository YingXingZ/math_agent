<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>设置新密码｜高数作业助手</title><style>:root{--ink:#102a43;--muted:#60758a;--blue:#2563eb;--line:#cdd9e6}*{box-sizing:border-box}body{font:16px "Microsoft YaHei",sans-serif;background:#f6f8fc;color:var(--ink);margin:0;display:grid;place-items:center;min-height:100dvh;padding:24px}.card{background:#fff;border:1px solid #e4ebf3;border-radius:18px;padding:30px;width:min(460px,100%);box-shadow:0 12px 32px #102a4314}h1{margin:0;font-size:28px}p{color:var(--muted);line-height:1.7}label{display:block;font-weight:700;margin-top:18px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:7px;font:inherit;min-height:46px}button{width:100%;margin-top:24px;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;min-height:46px}.error{color:#b91c1c;margin-top:12px;min-height:1.5em}.ok{color:#047857;margin-top:12px;line-height:1.7}@media(max-width:640px){body{padding:0;background:#fff;display:block}.card{min-height:100dvh;width:100%;border:0;border-radius:0;box-shadow:none;padding:88px 24px 32px}h1{font-size:26px}p,.error,.ok{font-size:15px}button{font-size:17px}}</style>
<main class="card"><h1>设置新密码</h1><p>此链接仅可使用一次，24 小时内有效。请设置至少 10 位的新密码。</p><form id="form"><label>新密码<input name="password" type="password" minlength="10" autocomplete="new-password" required></label><label>确认新密码<input name="confirm" type="password" minlength="10" autocomplete="new-password" required></label><button id="btn">保存新密码</button></form><div id="msg" class="error" role="alert"></div></main><script>const code=new URLSearchParams(location.search).get('code')||'',form=document.querySelector('#form'),msg=document.querySelector('#msg'),btn=document.querySelector('#btn');if(!code){msg.textContent='重置链接无效，请联系教师重新生成。';btn.disabled=true}form.onsubmit=async e=>{e.preventDefault();msg.className='error';msg.textContent='';const data=new FormData(form),password=String(data.get('password')||''),confirm=String(data.get('confirm')||'');if(password!==confirm){msg.textContent='两次输入的密码不一致。';return}btn.disabled=true;btn.textContent='保存中…';try{const r=await fetch('/api/auth/student-reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,password})});let x={};try{x=await r.json()}catch(_e){}if(!r.ok){msg.textContent=x.detail||'重置失败，请联系教师重新生成链接。';return}msg.className='ok';msg.textContent='密码已更新。请使用登录名“'+(x.username||'')+'”和新密码登录。';form.style.display='none';setTimeout(()=>location.replace('/login'),1800)}catch(_e){msg.textContent='网络连接异常，请稍后重试。'}finally{btn.disabled=false;btn.textContent='保存新密码'}};</script></html>
