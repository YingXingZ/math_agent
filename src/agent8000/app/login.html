<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录｜高数教材智能体</title><style>body{font:16px "Microsoft YaHei",sans-serif;background:#f6f8fc;color:#102a43;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:#fff;border:1px solid #e4ebf3;border-radius:16px;padding:28px;width:min(420px,92vw);box-shadow:0 12px 32px #102a4314}label{display:block;font-weight:700;margin-top:14px}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cdd9e6;border-radius:8px;margin-top:6px;font:inherit}button{margin-top:20px;background:#2563eb;color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}.hint{color:#60758a;line-height:1.7}.error{color:#b91c1c;margin-top:12px}</style>
<main class="card"><h1>高数教材智能体</h1><p class="hint">教师与学生均使用分配的账号登录。学生首次使用请先打开教师发放的邀请码链接。</p><form id="form"><label>登录名<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form><div id="msg" class="error"></div></main><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});if(!r.ok){document.querySelector('#msg').textContent=(await r.json()).detail||'登录失败';return}const x=await r.json();location.href=x.user.role==='student'?'/submit':'/'}</script></html>
