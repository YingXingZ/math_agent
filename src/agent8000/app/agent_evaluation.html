<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 评测 · MathBench</title><style>*{box-sizing:border-box}body{font:15px "Microsoft YaHei",sans-serif;background:#f5f7fb;color:#11213a;margin:0}.bar{height:68px;background:#fff;border-bottom:1px solid #e7edf5;display:flex;align-items:center;padding:0 max(28px,calc((100vw - 1180px)/2));gap:18px}.brand{font-size:20px;font-weight:800}.brand b{display:inline-grid;place-items:center;width:31px;height:31px;margin-right:9px;border-radius:9px;background:#5146ed;color:#fff}.crumb,.hint,.empty{color:#71839e}.wrap{max-width:1080px;margin:42px auto;padding:0 22px}.back{display:inline-block;color:#5146df;text-decoration:none;margin-bottom:22px;font-weight:700}h1{margin:0;font-size:29px}.intro{margin:10px 0 28px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e0e8f2;border-radius:16px;padding:18px;box-shadow:0 7px 20px #1b29420a}.n{font-size:29px;font-weight:800;color:#4f46e5;margin-bottom:8px}.section{margin-top:28px}.section h2{font-size:19px}.table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid #e0e8f2;border-radius:16px;overflow:hidden}.table th,.table td{padding:13px;text-align:left;border-bottom:1px solid #edf1f6}.table th{color:#607a9c;background:#f8faff}.table tr:last-child td{border-bottom:0}@media(max-width:680px){.wrap{margin:26px auto}.bar{padding:0 18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:24px}.table th,.table td{padding:9px;font-size:13px}}</style><header class="bar"><div class="brand"><b>问</b>MathBench</div><span class="crumb">资料库与质量中心 / Agent 评测</span></header><main class="wrap"><a class="back" href="/?panel=advancedTools">← 返回资料库与质量中心</a><h1>Agent 评测</h1><p class="hint intro">基于已发布错题后的真实复盘调用统计运行表现；学习闭环以系统验证的重做结果为准。</p><section class="section"><h2>Harness 运行指标</h2><section class="grid" id="harnessGrid">加载中…</section></section><section class="section"><h2>学生学习闭环</h2><section class="grid" id="learningGrid"></section></section><section class="section"><h2>复盘方式的学习效果</h2><table class="table"><thead><tr><th>复盘方式</th><th>已验证重做次数</th><th>重做改对率</th></tr></thead><tbody id="modeRows"></tbody></table></section><section class="section"><h2>常见错因</h2><table class="table"><thead><tr><th>错因代码</th><th>出现次数</th></tr></thead><tbody id="diagnosisRows"></tbody></table></section></main><script>const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),pct=x=>x==null?'—':Number(x).toFixed(1)+'%',ms=x=>x==null?'—':Number(x).toFixed(1)+' ms',cards=(target,items)=>target.innerHTML=items.map(v=>'<article class="card"><div class="n">'+esc(v[1])+'</div><div>'+esc(v[0])+'</div></article>').join('');fetch('/api/reports/agent-evaluation').then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.detail||'加载失败');return x}).then(x=>{cards(harnessGrid,[['样本数',x.sample_size],['自动确认率',pct(x.sympy_direct_rate)],['人工复核率',pct(x.teacher_review_rate)],['P95 耗时',ms(x.p95_latency_ms)],['失败率',pct(x.failure_rate)]]);cards(learningGrid,[['已完成重做',x.verified_reattempt_count],['重做改对率',pct(x.verified_corrected_rate)],['平均首次重做耗时',x.average_minutes_to_first_reattempt==null?'—':x.average_minutes_to_first_reattempt+' 分钟']]);const names={diagnose:'分析我错在哪',hint:'给我下一步提示',solution:'查看完整推导'};modeRows.innerHTML=['diagnose','hint','solution'].map(k=>{const v=x.hint_effectiveness?.[k]||{};return '<tr><td>'+names[k]+'</td><td>'+esc(v.attempt_count??0)+'</td><td>'+pct(v.verified_correct_rate)+'</td></tr>'}).join('');diagnosisRows.innerHTML=(x.common_diagnoses||[]).map(v=>'<tr><td>'+esc(v.code)+'</td><td>'+esc(v.count)+'</td></tr>').join('')||'<tr><td colspan="2" class="empty">暂无可验证的错因样本。</td></tr>'}).catch(e=>harnessGrid.innerHTML='<p class="empty">评测数据加载失败：'+esc(e.message)+'</p>')</script></html>
