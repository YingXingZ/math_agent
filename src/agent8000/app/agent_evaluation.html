<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>学习 Agent 评测面板</title><style>body{font:16px \"Microsoft YaHei\",sans-serif;background:#f6f8fc;color:#102a43;margin:0}.box{max-width:1040px;margin:7vh auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e4ebf3;border-radius:14px;padding:18px}.n{font-size:30px;font-weight:700;color:#2563eb}.hint{color:#60758a;line-height:1.6}.section{margin-top:30px}.table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}.table th,.table td{padding:12px;text-align:left;border-bottom:1px solid #e4ebf3}.table th{background:#edf4ff;color:#234}.empty{color:#60758a}@media(max-width:680px){.box{margin:24px auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:13px}.n{font-size:24px}.table th,.table td{padding:9px;font-size:14px}}</style><main class=\"box\"><a href=\"/\">← 返回教师工作台</a><h1>学习 Agent 评测面板</h1><p class=\"hint\">仅统计教师已发布错题后的真实复盘调用。重做“改对率”以系统验证结果为准，不以学生自行点击“我已改对”为准。</p><section class=\"grid\" id=\"grid\">加载中…</section><section class=\"section\"><h2>复盘方式的学习效果</h2><table class=\"table\"><thead><tr><th>复盘方式</th><th>已验证重做次数</th><th>重做改对率</th></tr></thead><tbody id=\"modeRows\"></tbody></table></section><section class=\"section\"><h2>重做提交方式</h2><table class=\"table\"><thead><tr><th>方式</th><th>验证次数</th><th>验证改对率</th></tr></thead><tbody id=\"inputRows\"></tbody></table></section><section class="section"><h2>常见错因（仅统计有结构化证据的诊断）</h2><table class="table"><thead><tr><th>错因代码</th><th>出现次数</th></tr></thead><tbody id="diagnosisRows"></tbody></table></section></main><script>const esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const pct=x=>Number(x||0).toFixed(1)+'%';fetch('/api/reports/agent-evaluation').then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.detail||'加载失败');return x}).then(x=>{const cards=[['样本数',x.sample_size],['SymPy 直接判定率',pct(x.sympy_direct_rate)],['Qwen 兜底率',pct(x.qwen_fallback_rate)],['人工复核率',pct(x.teacher_review_rate)],['手写识别失败率',pct(x.handwriting_ocr_failure_rate)],['平均响应时间',x.average_response_ms+' ms'],['已完成重做的复盘',x.verified_reattempt_count],['已改对的复盘',x.verified_corrected_count],['重做改对率',pct(x.verified_corrected_rate)],['手写图片重做次数',x.image_reattempt_count],['平均首次重做耗时',x.average_minutes_to_first_reattempt===null?'暂无数据':x.average_minutes_to_first_reattempt+' 分钟']];grid.innerHTML=cards.map(v=>'<article class=\"card\"><div class=\"n\">'+esc(v[1])+'</div><div>'+esc(v[0])+'</div></article>').join('');const modeNames={diagnose:'分析我错在哪',hint:'给我下一步提示',solution:'查看完整推导'};modeRows.innerHTML=['diagnose','hint','solution'].map(k=>{const v=x.hint_effectiveness?.[k]||{};return '<tr><td>'+modeNames[k]+'</td><td>'+esc(v.attempt_count||0)+'</td><td>'+pct(v.verified_correct_rate)+'</td></tr>'}).join('');const inputNames={text:'文字重做',image:'手写图片重做'};inputRows.innerHTML=['text','image'].map(k=>{const v=x.reattempt_by_input?.[k]||{};return '<tr><td>'+inputNames[k]+'</td><td>'+esc(v.attempt_count||0)+'</td><td>'+pct(v.verified_correct_rate)+'</td></tr>'}).join('');const diagnosisNames={SIGN_ERROR:'符号错误',EXPONENT_ERROR:'幂次错误',FORMULA_OR_METHOD_ERROR:'公式或方法使用不当',DOMAIN_CONDITION_OMITTED:'定义域或条件遗漏',INTEGRATION_CONSTANT_OMITTED:'积分常数遗漏',CHAIN_RULE_OMITTED:'链式法则遗漏',ENDPOINT_CHECK_OMITTED:'极值端点遗漏',SUBSTITUTION_BOUNDS_NOT_UPDATED:'换元上下限未同步'};diagnosisRows.innerHTML=(x.common_diagnoses||[]).map(v=>'<tr><td>'+esc(diagnosisNames[v.code]||v.code)+'</td><td>'+esc(v.count)+'</td></tr>').join('')||'<tr><td colspan="2" class="empty">暂无可验证的错因样本。</td></tr>' }).catch(e=>grid.innerHTML='<p class=\"empty\">评测数据加载失败：'+esc(e.message)+'</p>')</script></html>
