<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高数学习 Agent</title><script>window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']]},svg:{fontCache:'global'}};</script><script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script><style>body{margin:0;background:#f6f8fc;font:16px "Microsoft YaHei",sans-serif;color:#102a43}.box{max-width:850px;margin:5vh auto;padding:0 18px}.card{background:#fff;border:1px solid #e4ebf3;border-radius:16px;padding:24px;margin:16px 0;box-shadow:0 8px 24px #102a4310}h1{margin:0 0 8px}.hint{color:#60758a;line-height:1.7}label{display:block;font-weight:700;margin-top:14px}select,textarea,input{width:100%;box-sizing:border-box;margin-top:6px;padding:10px;border:1px solid #cdd9e6;border-radius:8px;font:inherit}textarea{min-height:92px}button{margin-top:14px;padding:11px 16px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.result{white-space:pre-wrap;line-height:1.7;background:#eef6ff;border-radius:10px;padding:14px}.trace{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.tag{padding:4px 8px;border-radius:99px;background:#dbeafe;color:#1d4ed8;font-size:13px}.error{background:#fff1f0;color:#b42318}a{color:#2563eb}</style><main class="box"><a href="/submit">← 返回作业提交</a><section class="card"><h1>高数学习 Agent</h1><p class="hint">题干使用 LaTeX 排版。你可以输入文本答案，或上传一张清晰的手写答案图片；图片会由本地 Qwen 识别后交给 Agent。</p><label>练习题<select id="problem"><option>加载题库中…</option></select></label><div id="stem" class="hint"></div><label>文本答案（可选）<textarea id="answer" placeholder="例如：(x+1)^2、x²+2x+1、\frac{1}{2}"></textarea></label><label>或上传手写答案图片（JPG / PNG，建议只拍这一题）<input id="image" type="file" accept="image/png,image/jpeg"></label><button id="check">检查我的答案</button></section><section class="card"><b>Agent 过程</b><div id="trace" class="trace"></div><div id="result" class="result">选择题目并提交答案后，这里会显示识别结果、Agent 路径与教学反馈。</div></section></main><script>const $=s=>document.querySelector(s),problem=$('#problem'),stem=$('#stem'),answer=$('#answer'),image=$('#image'),result=$('#result'),trace=$('#trace'),btn=$('#check');let items=[];const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function show(){let p=items.find(x=>x.id===problem.value);stem.innerHTML=p?`<b>${esc(p.section_no||'')} 第 ${esc(p.problem_no||'')} 题</b><br>${esc(p.content_text||'题干暂缺')}`:'';window.MathJax?.typesetPromise?.([stem])}async function load(){let r=await fetch('/api/learning/problems'),x=await r.json();items=x;problem.innerHTML=x.map(p=>`<option value="${p.id}">${esc(p.section_no||'')} · 第${esc(p.problem_no||'')}题</option>`).join('');show()}problem.onchange=show;function b64(file){return new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(file)})}btn.onclick=async()=>{let file=image.files[0],text=answer.value.trim();if(!problem.value||(!text&&!file)){result.textContent='请输入文本答案或上传手写图片。';return}btn.disabled=true;btn.textContent='Agent 正在分析…';trace.innerHTML='<span class="tag">题库读取</span><span class="tag">SymPy 校验</span>';try{let url='/api/learning/problems/'+encodeURIComponent(problem.value)+(file?'/learn-image':'/learn'),body=file?{image_base64:await b64(file)}:{student_answer:text};let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),x=await r.json();if(!r.ok)throw Error(x.detail||'请求失败');let s=file&&x.recognized_work?`识别到的手写答案：${x.recognized_work}\n\n`:'';trace.innerHTML+='<span class="tag">'+(file?'手写识别':'文本判等')+'</span><span class="tag">'+(x.action==='teacher_review'?'教师复核建议':'教学反馈')+'</span>';result.textContent=s+(x.response||'未返回反馈')}catch(e){result.textContent='调用失败：'+e.message;result.classList.add('error')}finally{btn.disabled=false;btn.textContent='检查我的答案'}};load().catch(e=>result.textContent='题库加载失败：'+e.message);</script></html>
