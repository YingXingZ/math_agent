<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>切题旁路对照 · MathBench</title>
<style>
  :root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#18243a;background:#f5f7fc}
  *{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dfe6f2;padding:16px max(18px,3vw);display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 10px}p{line-height:1.65}a{color:#5146e5}main{padding:20px max(18px,3vw);max-width:1750px;margin:auto}
  .notice{background:#edf3ff;border:1px solid #d9e4ff;border-radius:10px;padding:12px 15px;color:#334a70}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.chip{background:#fff;border:1px solid #dfe6f2;border-radius:9px;padding:9px 12px;font-weight:700}
  .row{background:#fff;border:1px solid #dfe6f2;border-radius:14px;margin:18px 0;padding:15px}.row-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.badge{border-radius:99px;background:#fff4e8;color:#9a4e08;padding:5px 9px;font-size:12px;font-weight:700}.badge.ok{background:#e8f8f3;color:#087f75}.risk{color:#9a4e08;line-height:1.7;margin:10px 0}.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.column{min-width:0;background:#f9fbff;border:1px solid #e3e9f3;border-radius:10px;padding:12px}.legend{font-size:13px;color:#63728a;margin:0 0 10px}.page{margin:12px 0;border:1px solid #cbd5e1;background:#fff;max-width:100%;overflow:auto}.page b{display:block;padding:7px 9px;background:#eef2f8}.image-wrap{position:relative;width:100%}.image-wrap img{display:block;width:100%;height:auto}.box{position:absolute;border:3px solid #2563eb;background:#2563eb22;pointer-events:none;min-width:2px;min-height:2px}.box.new{border-color:#e28009;background:#e2800928}.box.proposed{border:2px dashed #b91c1c;background:transparent}.box span{position:absolute;top:0;left:0;background:#fff;font-size:11px;color:#18243a;padding:1px 3px;white-space:nowrap}.muted{color:#64748b}.error{color:#b91c1c}
  @media(max-width:850px){.compare{grid-template-columns:1fr}}
</style>
<header><h1>切题旁路对照 <small class="muted">只读诊断</small></h1><a href="/">← 返回教师工作台</a></header>
<main><p class="notice">蓝框：现有批改/教师确认区域；橙框：18086 新模型候选；红虚线：重叠时的分界提议。候选框不写入题库、成绩或教师确认区域；冲突与漏题仍须人工核对原图。</p><div id="status">正在读取提交与旁路定位结果…</div><div id="summary" class="summary"></div><div id="rows"></div></main>
<script>
const params=new URLSearchParams(location.search), id=Number(params.get('submission_id'));
const status=document.getElementById('status'), summary=document.getElementById('summary'), root=document.getElementById('rows');
function node(tag, cls, text){const item=document.createElement(tag);if(cls)item.className=cls;if(text!==undefined)item.textContent=String(text);return item}
function pageCard(page, boxes, kind){const card=node('div','page'), title=node('b','',`第 ${page.page_no} 页`),wrap=node('div','image-wrap'),img=node('img');img.src=page.image_url;img.alt=`学生原作业第 ${page.page_no} 页`;card.append(title);wrap.append(img);boxes.filter(box=>Number(box.page_no)===page.page_no).forEach((box,index)=>{const mark=node('div','box '+kind),label=node('span','',kind==='proposed'?'仅供复核':`区域 ${index+1}`);mark.style.left=(box.x*100)+'%';mark.style.top=(box.y*100)+'%';mark.style.width=(box.width*100)+'%';mark.style.height=(box.height*100)+'%';mark.append(label);wrap.append(mark)});card.append(wrap);return card}
function column(title,desc,pages,boxes,kind,proposed=[]){const col=node('section','column'),heading=node('h2','',title);col.append(heading,node('p','legend',desc));for(const page of pages){const pageBoxes=boxes.filter(box=>Number(box.page_no)===page.page_no), proposedBoxes=proposed.filter(box=>Number(box.page_no)===page.page_no);const card=pageCard(page,pageBoxes,kind);if(proposedBoxes.length){const wrap=card.querySelector('.image-wrap');proposedBoxes.forEach(box=>{const mark=node('div','box proposed'),label=node('span','','提议，未采用');mark.style.left=(box.x*100)+'%';mark.style.top=(box.y*100)+'%';mark.style.width=(box.width*100)+'%';mark.style.height=(box.height*100)+'%';mark.append(label);wrap.append(mark)})}col.append(card)}return col}
async function init(){if(!Number.isSafeInteger(id)||id<1){status.textContent='链接缺少有效的提交编号';return}try{const response=await fetch(`/api/submissions/${id}/segmentation-compare`,{credentials:'same-origin',cache:'no-store'});if(!response.ok){let message='读取失败';try{message=(await response.json()).detail||message}catch{}throw Error(message)}const data=await response.json();status.textContent=`提交 #${data.submission_id} · 仅作诊断，不会修改成绩`;if(data.gateway_error)status.className='error';for(const [label,value] of [['题目',data.rows.length],['新模型漏题/无框',data.summary.missing],['相邻题重叠对',data.summary.overlap],['教师框覆盖异常',data.summary.teacher_gap||0],['新旧明显不一致',data.summary.disagreement],['需复核题目',data.summary.review]])summary.append(node('span','chip',`${label}：${value}`));for(const row of data.rows){const section=node('section','row'),head=node('div','row-head');head.append(node('h2','',row.problem_no),node('span','badge'+(row.needs_review?'':' ok'),row.needs_review?'须复核':'未发现定位风险'));section.append(head);const reasons=row.risks.length?row.risks.join('；'):'未发现确定性定位风险；仍须对照学生笔迹';section.append(node('p','risk',reasons));const grid=node('div','compare');grid.append(column('现有区域',row.current_source,data.pages,row.current_regions,'old'),column('18086 候选',`原始框 ${row.new_raw_regions.length} 个；候选 ${row.new_regions.length} 个。红框仅为提议。`,data.pages,row.new_regions,'new',row.new_proposed_regions));section.append(grid);root.append(section)}}catch(error){status.className='error';status.textContent=String(error.message||error)}}init();
</script>
</html>
