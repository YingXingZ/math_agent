<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教师评测案例标注</title><style>body{margin:0;background:#f5f7fb;color:#102a43;font:16px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #dde6f0;border-radius:14px;padding:18px;margin-top:18px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.candidate{border:1px solid #dbe4ef;border-radius:10px;padding:13px;margin:10px 0;cursor:pointer}.candidate:hover,.selected{border-color:#2563eb;background:#eff6ff}.meta,.hint{color:#567;font-size:14px}.math{white-space:pre-wrap;line-height:1.6}label{display:block;font-weight:650;margin:12px 0 5px}select,input,textarea{box-sizing:border-box;width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:9px;font:inherit}textarea{min-height:70px}button{margin-top:16px;border:0;border-radius:8px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:700}.ok{color:#087443}.error{color:#b42318}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:18px 12px}}</style><body><main class="wrap"><a href="/">← 返回教师首页</a><span class="hint">高级工具 · 研究与改进专用</span><h1>教师评测案例标注</h1><p class="hint">这里不用于布置作业、批改或发布成绩。仅在你要改进 Agent 时，从已复核作业中挑选代表性案例；只保存必要数学文本和教师裁定，不保存学生姓名、学号或原始作业图片。</p><div class="grid"><section class="card"><h2>1. 选择已复核作业条目</h2><div id="list">加载中…</div></section><section class="card"><h2>2. 教师确认标签</h2><div id="chosen" class="hint">请先在左侧选择一条。</div><form id="form" hidden><label>案例类型</label><select id="case_type"><option value="proof">证明题</option><option value="handwriting_steps">手写步骤图</option><option value="multi_part_page">多小问混页</option><option value="ai_teacher_disagreement">AI 与教师分歧</option></select><label>教师最终裁定</label><select id="teacher_correct"><option value="false">错误</option><option value="true">正确</option></select><label>安全路由预期</label><select id="expected_route"><option value="diagnose_misconception">可给学习诊断</option><option value="independent_solve">需 Qwen 独立求解</option><option value="teacher_review">需教师复核</option></select><label>错因代码（可选）</label><input id="diagnosis" placeholder="例如 missing_integration_constant"><label>分歧原因（可选）</label><textarea id="reason"></textarea><label><input id="review" type="checkbox" style="width:auto"> 此案例应始终转教师确认</label><label>备注（可选）</label><textarea id="note"></textarea><button>保存为脱敏评测案例</button></form><p id="status"></p></section></div><section class="card"><h2>已保存案例</h2><div id="saved" class="hint">加载中…</div></section></main><script>let selected=null,items=[];const $=id=>document.getElementById(id);function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){let h='';items.forEach((x,i)=>{h+='<article class="candidate '+(selected===x?'selected':'')+'" data-i="'+i+'"><b>'+esc(x.assignment_title)+' · 第 '+x.question_id+' 题</b><div class="meta">'+esc(x.class_name)+' · '+esc(x.question_type)+' · AI 初评：'+(x.ai_initial_correct===true?'正确':x.ai_initial_correct===false?'错误':'不确定')+' · 置信度 '+(x.confidence??'-')+'</div><div class="math">'+esc(x.problem_text)+'</div><div class="meta">识别作答：'+esc(x.student_answer||'（空）')+'</div></article>'});$('list').innerHTML=h||'暂无已教师复核且有可用数学文本的条目。';document.querySelectorAll('.candidate').forEach(e=>e.onclick=()=>{selected=items[+e.dataset.i];$('chosen').innerHTML='已选：<b>'+esc(selected.assignment_title)+'</b><br>题干：'+esc(selected.problem_text)+'<br>识别作答：'+esc(selected.student_answer)+'<br>标准答案：'+esc(selected.standard_answer);$('form').hidden=false;render()})}async function load(){let r=await fetch('/api/teacher/evaluation-cases/candidates');items=(await r.json()).items||[];render();r=await fetch('/api/teacher/evaluation-cases');let s=(await r.json()).items||[];$('saved').innerHTML=s.length?s.map(x=>'<div>#'+x.id+' · '+esc(x.case_type)+' · 教师裁定：'+(x.teacher_correct?'正确':'错误')+' · '+esc(x.expected_route)+' · '+esc(x.created_at)+'</div>').join(''):'还没有保存案例。'}$('form').onsubmit=async e=>{e.preventDefault();if(!selected)return;let b={source_submission_id:selected.submission_id,question_id:selected.question_id,case_type:$('case_type').value,teacher_correct:$('teacher_correct').value==='true',expected_route:$('expected_route').value,expected_diagnosis:$('diagnosis').value,requires_teacher_review:$('review').checked,disagreement_reason:$('reason').value,teacher_note:$('note').value};let r=await fetch('/api/teacher/evaluation-cases',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();$('status').className=r.ok?'ok':'error';$('status').textContent=r.ok?d.message:(d.detail||'保存失败');if(r.ok)load()};load();</script></body></html>
